<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LA TAUPE — socle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 5rem; font: inherit; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.5rem 1.5rem; font: inherit; cursor: pointer; }
    #reply { margin-top: 1.5rem; padding: 1rem; background: #f2f2f2; border-radius: 6px; white-space: pre-wrap; min-height: 2rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>LA TAUPE — socle (palier 2)</h1>
  <p>Envoie un message, reçois une vraie réponse du modèle. Aucun corpus, aucune détection à ce stade.</p>
  <textarea id="message" placeholder="Écris un message..."></textarea>
  <br>
  <button id="send">Envoyer</button>
  <div id="reply"></div>

  <script>
    const sendBtn = document.getElementById("send");
    const messageEl = document.getElementById("message");
    const replyEl = document.getElementById("reply");

    sendBtn.addEventListener("click", async () => {
      const message = messageEl.value.trim();
      if (!message) return;

      sendBtn.disabled = true;
      replyEl.textContent = "…";
      replyEl.classList.remove("error");

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur inconnue");
        replyEl.textContent = data.reply;
      } catch (err) {
        replyEl.textContent = "Erreur : " + err.message;
        replyEl.classList.add("error");
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
